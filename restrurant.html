<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Revenue System</title>
</head>

<body bgcolor="#F5F5DC">

<center>
    <h1>🍽 RESTAURANT REVENUE SYSTEM</h1>

    <!-- Restaurant Banner -->
    <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1000"
         alt="Restaurant"
         width="900"
         height="350">

    <br><br>

    <!-- Food Images -->
    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300"
         alt="Pizza"
         width="220"
         height="150">

    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300"
         alt="Burger"
         width="220"
         height="150">

    <img src="https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=300"
         alt="Biryani"
         width="220"
         height="150">

    <br><br>
</center>

<form>

<table border="1" cellpadding="8" align="center" width="70%" bgcolor="lightyellow">

<tr>
<th colspan="2" bgcolor="orange">
Restaurant Revenue Form
</th>
</tr>

<tr>
<td>Restaurant Name</td>
<td><input type="text" placeholder="Restaurant Name"></td>
</tr>

<tr>
<td>Customer Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Contact Number</td>
<td><input type="tel"></td>
</tr>

<tr>
<td>Table Number</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Date</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Time</td>
<td><input type="time"></td>
</tr>

<tr>
<td>Location</td>
<td><input type="text" placeholder="City / Branch"></td>
</tr>

<tr>
<td>Cashier Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Food Item</td>
<td>
<select>
<option>Pizza</option>
<option>Burger</option>
<option>Biryani</option>
<option>Pasta</option>
<option>BBQ</option>
<option>Fries</option>
<option>Drink</option>
</select>
</td>
</tr>

<tr>
<td>Quantity</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Price (PKR)</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Discount (%)</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Tax (%)</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Payment Method</td>
<td>
<input type="radio" name="pay">Cash
<input type="radio" name="pay">Card
<input type="radio" name="pay">Online
</td>
</tr>

<tr>
<td>Order Type</td>
<td>
<input type="checkbox">Dine In
<input type="checkbox">Take Away
<input type="checkbox">Delivery
</td>
</tr>

<tr>
<td>Total Revenue (PKR)</td>
<td><input type="number"></td>
</tr>

<tr>
<td>Remarks</td>
<td>
<textarea rows="4" cols="40"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Save Report">
<input type="reset" value="Clear Form">
</td>
</tr>

</table>

</form>

<br>


</body>
</html>
