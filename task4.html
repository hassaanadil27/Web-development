<html>

            <th> <tr> INFORMATION TABLE </tr></th>

            <tr>
<td class="label">NAME</td>
<td>
<input type="text" placeholder="ENTER YOUR FULL NAME">

</tr>

         <td class = "label">PASSWORD</td>
            <td>
            <input type = "text" placeholder = "ENTER YOUR PASSWORD">
            </td>

        <td class = "label">COUNTRY</td>

        <select>
       <option>Pakistan</option>

<td>
<input type="radio" name="gender"> Male
&nbsp;&nbsp;

</tr>

<tr>

</tr>

<span class="note">

</tr>


<tr>

<textarea placeholder="WRITE ANY OTHER INFORMATION THAT IS NOT PROVIDED ABOVE"></textarea>

</tr>


        </table>

        <div class="buttons">
<button type="submit">SEND IN MY REPORT</button>
<button type="reset">ERASE REPORT FORM</button>
</div>

        </form>
    </Body>
